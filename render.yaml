services:
  - type: web
    name: career-portal-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && playwright install chromium"
    startCommand: "uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: DEFAULT_LLM_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
