services:
  - type: web
    name: career-portal-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && playwright install --with-deps chromium"
    startCommand: "uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
